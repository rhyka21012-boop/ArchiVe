org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Flutter の Gradle プラグインは buildTypes の ndk.abiFilters を
# 無条件にクリアして自前の値で上書きする (FlutterPlugin.kt)。
# このプロパティを定義するとその処理が skip され、
# app/build.gradle.kts の release 向け abiFilters が有効になる。
# ffmpeg の x86_64 ライブラリ (16MB) を配信物から外すために必要。
# NOTE: Flutter 内部実装に依存するため、SDK 更新時は効いているか確認すること。
disable-abi-filtering=true
